[project]
name = "clipcrest"
description = "Turn long videos and live streams into captioned vertical clips (Reels, Shorts, TikTok) on your own computer."
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.162.5",
    "httpx==0.28.1",
    "numpy==2.2.6",
    "pillow==11.3.0",
    "psycopg==3.3.9",
    "psycopg-binary==3.3.9",
    "python-multipart==0.0.32",
    "sherpa-onnx==2.0.1",
    "soundfile==0.14.0",
    "sqlalchemy==2.0.57",
    "uvicorn==0.54.0",
    "yt-dlp==2026.10.21",
]
